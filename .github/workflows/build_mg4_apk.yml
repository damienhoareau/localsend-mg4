name: Build MG4 APK

# Builds the MG4 fork of LocalSend and publishes the APKs as a workflow artifact.
# No secrets needed: without key.properties the release APK is signed with the debug key
# (see app/android/app/build.gradle).

on:
  push:
    branches: [mg4]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build_apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        run: rustup toolchain install --profile minimal # version from rust-toolchain.toml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Dependencies (cargokit - rust_builder)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: localsend-mg4-apk
          path: |
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-x86_64-release.apk
